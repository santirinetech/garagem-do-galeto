<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acompanhar Pedido — Galeto Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="stylesheet" href="css/acompanhar.css">
</head>
<body>

<div class="container">
    <span class="material-icons-round icon">moped</span>
    <h1>Acompanhe seu Pedido</h1>
    
    <div id="loader">
        <span class="material-icons-round spin loader-icon">autorenew</span>
        <p class="loader-text">Buscando informações do seu pedido...</p>
    </div>

    <div id="status-container" style="display: none;">
        <div class="status-box" id="s-box">
            <span class="status-badge" id="s-badge">Pendente</span>
            <p id="s-msg" class="status-msg">Seu pedido foi recebido e estamos aguardando a confirmação do pagamento / início do preparo.</p>
        </div>
        <div class="pedido-desc" id="p-desc"></div>
        <div class="pedido-desc" id="p-pag"></div>
        <div class="pedido-total" id="p-total"></div>
    </div>

    <a href="/cardapio.html" class="btn-voltar">
        <span class="material-icons-round">restaurant_menu</span> Voltar ao Cardápio
    </a>
</div>

<footer class="footer-acompanhar">
    Desenvolvido com <span class="heart">♥</span> por <strong class="author">Santirine Tech</strong>
</footer>

<script src="js/acompanhar.js"></script>
</body>
</html>
